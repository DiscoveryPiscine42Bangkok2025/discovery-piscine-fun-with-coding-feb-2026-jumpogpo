<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>42 Bangkok - Web Development</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="card">
      <h1 class="card-title">My Profile</h1>

      <table class="layout">
        <tr>
          <td class="center">
            <img
              src="https://cdn.intra.42.fr/users/849659cfad506ac81c73c6b3228401e8/default.jpg"
              alt="Profile picture"
              class="profile-pic"
            />
            <div class="login">tkoedpia</div>
            <div class="description">Thanapat Koedpiam</div>
          </td>
        </tr>
        <tr>
          <td class="center socials">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
              alt="GitHub"
            />

            <img
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/500px-Facebook_Logo_%282019%29.png"
              alt="Facebook"
            />

            <img
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/500px-Instagram_icon.png"
              alt="Instagram"
            />
          </td>
        </tr>
        <tr>
          <td class="center">
            <button class="contact-btn">Contact</button>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
